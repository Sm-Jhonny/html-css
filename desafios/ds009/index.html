<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist de Estudos</title>
    <link rel="shortcut icon" href="pictures/menu-icon.png" type="image/png">
    <style>
        body{
            background-image: url(pictures/conceito-de-colagem-de-html-e-css-com-pessoa.jpg) ;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        header{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
            margin-bottom: 15px;
            padding: 20px;
            background: #212326;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 800px;
            margin-left: auto;
            margin-right: auto;
            color: #4AA2D9;
            border: 5px solid #061F40;
        } 
        
        .link{
            text-align: center;
            margin: 15px 0;
        }

        .link img{
            border: 4px solid #4AA2D9;
            border-radius: 12px;
            padding: 5px;
            background-color: #061F40;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        .link img:hover{
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            border-color: #6bb8e6;
        }



        .cabecario {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: #212326;
            text-align: center;
            padding: 2px;
            color: #4AA2D9;
            border: 5px solid #061F40; /* Moldura externa */
            border-radius: 10px; /* Cantos arredondados */
            margin: 20px auto;
            max-width: 800px;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
   
    </style>
</head>
<body>

    <header>
        <h1>VIDEOS PARA ASSISTIR</h1>
    </header>


        <div class="cabecario">
            <p>Curso JavaScript</p>
        </div>
        <div class="link"><a href="javascrip.html"><img src="pictures/thumb-js.png" alt=""></a></div>

         <div class="cabecario">
            <p>Curso Python</p>
        </div>
        <div class="link"><a href="python.html"><img src="pictures/thumb-python.png" alt=""></a></div>

        <div class="cabecario">
            <p>Curso HTML5</p>
        </div>
        <div class="link"><a href="html5.html"><img src="pictures/thumb-html.png" alt=""></a></div>

        <div class="cabecario">
