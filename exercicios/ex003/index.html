<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocando Imagens No Site</title>
</head>
<body>
     <h1>Testando carga de imagem</h1>
        <p>Abaixo você vai ver uma imagem que estar na mesma pasta! </p>
        <img src="HTML5-200.png" alt="Logo HTML5">
        <img src="logocss-280.png" alt="Logo CSS">
        <p>Da mesma forma posso colocara imagens que estao em outra pasta.</p>
        <p>Exemplo:</p>
        <img src="imagens/HTML5-480.png" alt="Logo HTML5">
    <h1>Imagens externas:</h1>
        <p>Tambem podemos carregar imagens de links externos. <br> Exemplo:</p>
        <img src="http://luizricardo.org/wordpress/wp-content/upload-files/2014/03/javascript_logo_unofficial-300x300-150x150.png" alt="Logo JavaScript"> <!--Nome do link externo é URL-->
        
</body>
</html>
