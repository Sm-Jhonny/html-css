<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainig Position</title>
    <style>

        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 99vh;
            margin: 0;
            border: 20px dashed black ;
            
        }

        .container{
            display: grid;
            grid-template-columns: repeat(3, 427px);
            gap: 10px;
        }

        div.bloco{
            background-image: url(img/wallpaper003.jpg);
            height: 284px;
            width: 427px;
            border: 1px solid black;
            border-radius: 10px;
            margin: 10px;
            background-repeat: no-repeat;
        }

        #q1{
            background-position: left top;
        }
        #q2{
            background-position: center top;
        }
        #q3{
            background-position: right top;
        }
        #q4{
            background-position: center left;
        }
        #q5{
            background-position: center center;
        }
        #q6{
            background-position: center right;
        }
        #q7{
            background-position: left bottom;
        }
        #q8{
            background-position: center bottom;
        }
        #q9{
            background-position: right bottom;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="bloco" id="q1">
        </div>

        <div class="bloco" id="q2">
        </div>

        <div class="bloco" id="q3">
        </div>

        <div class="bloco" id="q4">
        </div>

        <div class="bloco" id="q5">
        </div>

        <div class="bloco" id="q6">
        </div>

        <div class="bloco" id="q7">
        </div>

        <div class="bloco" id="q8">
        </div>

        <div class="bloco" id="q9">
        </div>

    </div>
</body>
</html>
